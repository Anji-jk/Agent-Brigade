[project]
name = "agent-brigade"
version = "0.1.0"
description = "Multi-agent orchestration platform: Jira stories in, verified code out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3.0",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["core*", "pipeline*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12